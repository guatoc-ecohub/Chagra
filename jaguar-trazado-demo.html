<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Jaguar AUTO-TRAZADO riggeado — gate visual</title>
  <style>
    body{ margin:0; background:#efe7d4; font:13px/1.4 system-ui, sans-serif; color:#2a1a0c; }
    body.magenta{ background:#f0f; }
    .fila{ display:flex; flex-wrap:wrap; gap:8px; padding:10px; align-items:flex-start; }
    .caja{ background:#f7f1e2; border:1px solid #d8c9a6; border-radius:8px; padding:6px 10px 10px; }
    body.magenta .caja{ background:transparent; border-color:#a0a; }
    .caja h3{ margin:2px 0 4px; font-size:13px; font-weight:600; }
    .lienzo{ width:760px; }
    .ref img{ width:760px; display:block; }
    /* pines de STRESS anti-decapitación: congelan el giro en su extremo */
    .pin-giro .jh-cabezaGiro{ animation:none !important; transform:rotate(-18deg) !important; }
    .pin-giro .jh-cabeza{ animation:none !important; }
    .pin-giro2 .jh-cabezaGiro{ animation:none !important; transform:rotate(14deg) !important; }
    .pin-giro2 .jh-cabeza{ animation:none !important; }
    /* pin de STRESS de la cola: lash al extremo */
    .pin-cola .jh-colaBase{ animation:none !important; transform:rotate(-7deg) !important; }
    .pin-cola .jh-colaMedia{ animation:none !important; transform:rotate(8deg) !important; }
    .pin-cola .jh-colaPunta{ animation:none !important; transform:rotate(-13deg) !important; }
    /* pin de STRESS de marcha: patas congeladas en pleno vuelo */
    .pin-paso .jh-pataDelCerca{ animation:none !important; transform:rotate(-14.5deg) !important; }
    .pin-paso .jh-pataDelCercaBajo{ animation:none !important; transform:rotate(-21deg) !important; }
    .pin-paso .jh-pataDelCercaZarpa{ animation:none !important; transform:rotate(-10deg) !important; }
    .pin-paso .jh-pataTrasCerca{ animation:none !important; transform:rotate(13.5deg) !important; }
    .pin-paso .jh-pataTrasLejos{ animation:none !important; transform:rotate(-11deg) !important; }
    .pin-paso .jh-pataDelLejos{ animation:none !important; transform:rotate(10deg) !important; }
    /* CALCO: la lámina debajo, el vector encima al 55% — para calzar siluetas.
       viewBox -30 -80 765 500 → con W=765px la lámina (705×394) va en 30,80. */
    .calco{ position:relative; width:765px; height:500px; }
    .calco img{ position:absolute; left:30px; top:80px; width:705px; height:394px; }
    .calco > div{ position:absolute; inset:0; opacity:.55; }
    .calco .jaguarHuesos *{ animation:none !important; }
    /* REGIONES: la lámina + los polígonos de clip encima (depurar cortes) */
    .regiones{ position:relative; width:765px; height:500px; }
    .regiones img{ position:absolute; left:30px; top:80px; width:705px; height:394px; opacity:.75; }
    .regiones svg{ position:absolute; inset:0; width:100%; height:100%; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/jaguar-trazado-demo.jsx"></script>
</body>
</html>
