<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102016">
<title>Micelio</title>
<style>
  :root{
    --bg0:#0d1610;
    --bg1:#203925;
    --bg2:#3e5d33;
    --bg3:#7d6a34;
    --bg4:#f2e4bf;
    --ink:#f7edd7;
    --ink-dim:#d9c9a7;
    --paper:#f8ecd0;
    --soil:#27160d;
    --soil-2:#4a2d18;
    --leaf:#74b353;
    --leaf-2:#3d7c40;
    --gold:#d3a84d;
    --cyan:#86d4d0;
    --rose:#db6d64;
    --hud:rgba(15,22,16,.72);
  }
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg0);color:var(--ink);font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
  body{touch-action:none;overscroll-behavior:none}
  #app{
    position:fixed;inset:0;overflow:hidden;
    background:
      radial-gradient(1100px 720px at 50% 14%, rgba(255,247,208,.12), transparent 58%),
      radial-gradient(860px 520px at 14% 0%, rgba(120,190,107,.16), transparent 48%),
      radial-gradient(780px 500px at 86% 6%, rgba(212,164,86,.10), transparent 42%),
      linear-gradient(180deg,var(--bg1) 0%, var(--bg2) 34%, var(--bg3) 68%, var(--bg0) 100%);
    transition: background .35s ease;
  }
  canvas#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #labels{position:absolute;inset:0;pointer-events:none;z-index:4}
  #hud{
    position:absolute;left:12px;top:12px;z-index:5;width:min(92vw,440px);
    background:linear-gradient(180deg,rgba(12,18,13,.86),rgba(20,30,22,.66));
    border:1px solid rgba(255,248,225,.15);
    border-radius:18px;padding:12px 13px 11px;
    box-shadow:0 14px 34px rgba(0,0,0,.28);
    backdrop-filter:blur(10px);
    line-height:1.34
  }
  #brand{
    display:flex;align-items:center;gap:8px;letter-spacing:.12em;text-transform:uppercase;
    color:#b9f09d;font-size:11px;opacity:.9
  }
  #brand .dot{
    width:11px;height:11px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #fff6d0 0 16%, #b8e56f 22% 46%, #245e31 52% 100%);
    box-shadow:0 0 18px rgba(178,231,112,.45)
  }
  #title{
    margin:8px 0 4px;font-size:clamp(24px,5vw,50px);line-height:.96;font-style:italic;color:#fff4d4
  }
  #stageLine{
    display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;
    margin:0 0 6px
  }
  #stageName{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#d8efc7}
  #meter{
    display:flex;align-items:center;gap:8px;font-size:12px;color:#c9dcb5
  }
  #meterBar{
    width:140px;height:9px;border-radius:999px;overflow:hidden;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.09)
  }
  #meterFill{height:100%;width:0%;background:linear-gradient(90deg,#86d66e,#d8b34e,#f2dd8d);border-radius:999px}
  #prompt{margin:7px 0 0;font-size:14px;line-height:1.45;color:var(--ink-dim)}
  #prompt strong{color:#fff4c9}
  #chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
  .chip{
    display:inline-flex;align-items:center;gap:6px;
    padding:6px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.08);
    background:rgba(255,255,255,.06);color:#f4e7c7;font-size:12px;line-height:1
  }
  .chip b{color:#fff6d8}
  #toast{
    position:absolute;left:50%;top:14px;transform:translateX(-50%) translateY(-10px);z-index:8;
    background:rgba(249,236,205,.97);color:#342015;border:2px solid rgba(47,28,14,.86);
    border-radius:999px;padding:8px 14px;font-size:14px;box-shadow:0 10px 22px rgba(0,0,0,.18);
    opacity:0;transition:opacity .22s ease,transform .22s ease
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #controls{
    position:absolute;left:0;right:0;bottom:10px;z-index:7;display:flex;justify-content:space-between;align-items:flex-end;
    padding:0 12px;gap:12px;pointer-events:none
  }
  .pad{display:flex;gap:10px;pointer-events:auto}
  .btn{
    appearance:none;-webkit-appearance:none;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;
    width:66px;height:66px;border-radius:18px;border:1px solid rgba(255,245,220,.68);
    background:linear-gradient(180deg,rgba(54,34,19,.84),rgba(20,13,7,.92));
    color:#fff3d4;font:700 24px/1 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    box-shadow:0 10px 18px rgba(0,0,0,.24)
  }
  .btn:active,.btn.down{transform:translateY(2px) scale(.98)}
  #zoomBtn{width:146px;font-size:14px;letter-spacing:.06em;text-transform:uppercase}
  #zoomBtn strong{display:block;font-size:22px;line-height:1}
  #backBtn{
    position:absolute;left:14px;bottom:88px;z-index:7;pointer-events:auto;
    appearance:none;border:1px solid rgba(255,245,220,.68);
    background:linear-gradient(180deg,rgba(245,233,201,.96),rgba(221,205,166,.94));
    color:#3f2716;border-radius:999px;padding:10px 14px;
    font:700 13px "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    box-shadow:0 10px 20px rgba(0,0,0,.22);
    opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .22s ease,transform .22s ease
  }
  #backBtn.show{opacity:1;transform:translateY(0);pointer-events:auto}
  #intro{
    position:absolute;inset:0;z-index:10;display:grid;place-items:center;
    background:
      radial-gradient(circle at 50% 48%, rgba(255,246,215,.96) 0 10%, rgba(49,36,17,.93) 11% 14%, rgba(8,10,8,.93) 15% 20%, rgba(0,0,0,0) 21%),
      radial-gradient(circle at 50% 48%, rgba(15,20,15,.94) 0 29%, rgba(7,10,7,.98) 30% 100%);
    transition:opacity .5s ease,transform .5s ease
  }
  #intro.hidden{opacity:0;pointer-events:none;transform:scale(1.02)}
  #introCard{
    width:min(90vw,560px);padding:22px 20px 20px;border-radius:26px;
    background:linear-gradient(180deg,rgba(250,240,214,.98),rgba(233,220,194,.93));
    color:#2a1a0f;border:2px solid rgba(38,24,12,.9);box-shadow:0 22px 52px rgba(0,0,0,.34);
    text-align:center
  }
  #introCard h1{margin:0 0 10px;font-size:clamp(30px,6vw,58px);line-height:1;font-style:italic}
  #introCard p{margin:7px 0 0;font-size:15px;line-height:1.46}
  #introCard .sub{font-size:12px;letter-spacing:.1em;text-transform:uppercase;opacity:.72}
  #startBtn{
    margin-top:14px;padding:12px 18px;border-radius:999px;border:2px solid #27180b;
    background:linear-gradient(180deg,#f3c95f,#c7952b);color:#27180b;font-weight:800;
    box-shadow:0 8px 0 rgba(39,24,11,.28);cursor:pointer;font-family:inherit;font-size:15px
  }
  #startBtn:active{transform:translateY(2px);box-shadow:0 6px 0 rgba(39,24,11,.28)}
  @media (max-width:760px){
    #hud{width:calc(100vw - 24px);font-size:13px}
    .btn{width:60px;height:60px;border-radius:16px}
    #zoomBtn{width:132px}
    #backBtn{bottom:92px}
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "../../vendor/three.module.js",
    "three/addons/": "../../vendor/addons/"
  }
}
</script>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>
  <div id="labels"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="hud">
    <div id="brand"><span class="dot"></span>Micelio · viaje de escalas</div>
    <h1 id="title">Micelio</h1>
    <div id="stageLine">
      <div id="stageName"></div>
      <div id="meter"><span id="meterText">0 / 0</span><div id="meterBar"><div id="meterFill"></div></div></div>
    </div>
    <p id="prompt"></p>
    <div id="chips"></div>
  </div>
  <button id="backBtn" type="button">Volver</button>
  <div id="controls" aria-label="Controles">
    <div class="pad">
      <button class="btn" id="backStageBtn" aria-label="Escala anterior">−</button>
      <button class="btn" id="forwardStageBtn" aria-label="Escala siguiente">+</button>
    </div>
    <div class="pad">
      <button class="btn" id="zoomBtn" aria-label="Acción principal"><span>ZOOM</span><strong>↟</strong></button>
    </div>
  </div>
  <div id="intro">
    <div id="introCard">
      <div class="sub">Macro a micro, sin corte</div>
      <h1>Micelio</h1>
      <p>Desciende por la planta viva: primero sus partes, luego la raíz, después la red del suelo y al final la célula con su ADN.</p>
      <p class="sub">Toca · arrastra · zoom · teclado y táctil</p>
      <button id="startBtn">Entrar</button>
    </div>
  </div>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
