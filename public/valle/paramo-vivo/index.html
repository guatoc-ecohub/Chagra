<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c9d8c7">
<title>Páramo Vivo · rescate</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:linear-gradient(180deg,#d8e6dd 0%,#a4c19f 42%,#6c845f 100%);color:#1f281f;font-family:Georgia,serif}
  #app{position:fixed;inset:0}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #hud{position:absolute;left:14px;top:14px;z-index:20;max-width:min(92vw,460px);padding:12px 14px;border-radius:18px;background:rgba(14,22,15,.72);color:#f2f7ea;backdrop-filter:blur(8px);box-shadow:0 14px 32px rgba(0,0,0,.22)}
  #hud h1{margin:0 0 6px;font-size:clamp(24px,4vw,42px);line-height:.95;font-style:italic}
  #hud p{margin:0;font-size:13px;line-height:1.45;color:#d9e8d3}
  #chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:999px;background:rgba(255,255,255,.08);font-size:12px}
  .chip b{color:#fff0ad}
  #perf{position:absolute;right:12px;top:12px;z-index:20;padding:8px 10px;border-radius:12px;background:rgba(12,18,12,.66);color:#f2f9ee;font:12px/1.25 monospace;white-space:pre}
  #note{position:absolute;right:12px;bottom:12px;z-index:20;max-width:min(38vw,390px);padding:10px 12px;border-radius:14px;background:rgba(248,243,224,.95);color:#41301d;font-size:12px;line-height:1.45;box-shadow:0 12px 24px rgba(0,0,0,.2)}
  @media (max-width:760px){#note{left:12px;right:12px;bottom:12px;max-width:none}}
</style>
<script type="importmap">
{
  "imports": {
    "three": "../vendor/three.module.js",
    "three/addons/": "../vendor/addons/"
  }
}
</script>
</head>
<body>
<div id="app"></div>
<div id="hud">
  <h1>Páramo Vivo</h1>
  <p>El frailejón-Ent, la queñua, el chivito y el descenso científico del páramo.</p>
  <div id="chips">
    <span class="chip"><b>Arrastre</b> mirar</span>
    <span class="chip"><b>Rueda</b> zoom</span>
    <span class="chip"><b>Click</b> libre</span>
  </div>
</div>
<div id="perf">FPS --</div>
<div id="note">El páramo de Guatoc: frailejones, queñua y el abuelo que abriga el agua.</div>
<script type="module" src="./main.js"></script>
</body>
</html>
