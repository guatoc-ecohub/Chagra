<defs>
      <linearGradient id="gCieloDia" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#9fd0e8"/>
        <stop offset=".55" stop-color="#cfe8cf"/>
        <stop offset="1" stop-color="#b6d494"/>
      </linearGradient>
      <radialGradient id="gSol" cx=".5" cy=".5" r=".5">
        <stop offset="0" stop-color="#ffedc2" stop-opacity=".95"/>
        <stop offset=".45" stop-color="#f6cf7a" stop-opacity=".4"/>
        <stop offset="1" stop-color="#f6cf7a" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="gAuraAbeja" cx=".5" cy=".5" r=".5">
        <stop offset="0" stop-color="#e2a83e" stop-opacity=".38"/>
        <stop offset="1" stop-color="#e2a83e" stop-opacity="0"/>
      </radialGradient>
      <!-- abdomen ambar palido con volumen suave (brillo especular) -->
      <radialGradient id="gAbdomen" cx=".42" cy=".32" r=".78">
        <stop offset="0" stop-color="#f2bd5c"/>
        <stop offset=".58" stop-color="#e2a83e"/>
        <stop offset="1" stop-color="#cf8f2e"/>
      </radialGradient>
      <!-- torax: pelusa oscura que se FUNDE en el ambar (sin anillo/borde) -->
      <radialGradient id="gThoraxFur" cx=".46" cy=".40" r=".72">
        <stop offset="0" stop-color="#3c2c18"/>
        <stop offset=".55" stop-color="#3c2c18"/>
        <stop offset="1" stop-color="#5a4326" stop-opacity="0"/>
      </radialGradient>
      <!-- clipeo: mascara facial clara con volumen -->
      <radialGradient id="gCara" cx=".6" cy=".46" r=".66">
        <stop offset="0" stop-color="#ffe4b0"/>
        <stop offset="1" stop-color="#f2c37e"/>
      </radialGradient>
      <!-- lente ahumado LIMPIO (los ojos se leen a traves) -->
      <linearGradient id="gLente" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#1a0f07" stop-opacity=".70"/>
        <stop offset=".5" stop-color="#2e1e0e" stop-opacity=".52"/>
        <stop offset="1" stop-color="#54381d" stop-opacity=".34"/>
      </linearGradient>
      <filter id="boil" x="-8%" y="-8%" width="116%" height="116%">
        <feTurbulence id="boilTurb" type="fractalNoise" baseFrequency="0.02" numOctaves="1" seed="1" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4"/>
      </filter>
      <filter id="grano">
        <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" result="g"/>
        <feColorMatrix in="g" type="matrix" values="0 0 0 0 0.09 0 0 0 0 0.07 0 0 0 0 0.03 0 0 0 .04 0"/>
      </filter>
    </defs>