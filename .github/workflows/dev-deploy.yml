name: Deploy Chagra PWA (DEV)

# Deploy automatico a entorno DEV en alpha para la rama de preview designada.
# Target: /mnt/fast/appdata/farmos-pwa-dev. Concurrency por branch
# (cancel-in-progress: true) para que pushes rapidos a la misma rama solo
# deplieguen el ultimo build. Sin lint step (a diferencia de prod/QA), para
# iteracion rapida.
#
# IMPORTANTE: este workflow ya NO dispara en cada feat/*|fix/*. Antes lo hacia
# y TODAS las ramas de feature deployaban al MISMO target farmos-pwa-dev,
# pisandose entre si (stomping) -> el index.html de una rama quedaba sirviendo
# assets /assets/*.js|css de otra que ya no existian -> pantalla negra. Ahora
# solo la rama de preview ('dev' / 'dev/*') auto-deploya. Para previsualizar
# una feature en dev, mergeala a la rama de preview.

on:
  push:
    branches: ['dev', 'dev/*']
    paths-ignore:
      - '**.md'
      - 'LICENSE'

concurrency:
  group: deploy-chagra-dev-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: [self-hosted, alpha]
    timeout-minutes: 30
    steps:
      - name: Detect runner identity
        run: |
          if echo "$HOME" | grep -q claude-runner; then
            echo "SKIP_DEPLOY=1" >> "$GITHUB_ENV"
          fi

      - if: env.SKIP_DEPLOY != '1'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - if: env.SKIP_DEPLOY != '1'
        name: Install dependencies
        run: npm ci

      - if: env.SKIP_DEPLOY != '1'
        name: Build
        run: npm run build
        env:
          VITE_FARMOS_URL: ""
          VITE_FARMOS_CLIENT_ID: farm
          VITE_USE_SIDECAR_AGRO_MCP: "true"
          VITE_FINCA_VIVA_HOME_PERFIL: "true"
          # HomeCampesinoB (#3053): la bandera homeCampesinoBActivo() hace
          # DEFAULT ON cuando VITE_HOME_CAMPESINO_B no está seteada, lo que
          # convirtió la home campesina en el default post-login de
          # chagra-dev.guatoc.co (regresión). dev debe conservar la home
          # NORMAL del PWA; la home campesina B vive en campesino.guatoc.co
          # (build aparte con VITE_HOME_CAMPESINO_B=true). Apagamos aquí.
          VITE_HOME_CAMPESINO_B: "false"
          # Registro unificado (#23): puerta única "Registrar" (voz + manual) en
          # dev. OFF en prod (deploy.yml no la define) hasta el visto bueno.
          VITE_REGISTRO_UNIFICADO: "true"
          # Colibrí REAL (barbudito de páramo por sprite) en home + FAB +
          # transición. Dev-only para revisión del operador; AUSENTE en
          # deploy.yml (prod) → prod conserva el colibrí 2D / video actual.
          VITE_COLIBRI: "true"
          VITE_CHAGRA_MCP_TOKEN: ${{ secrets.VITE_CHAGRA_MCP_TOKEN }}
          # #2593 corpus→chat: base del sidecar (nginx-proxied). DEBE ser
          # /api/mcp/agro (no /api) o corpusRetriever pega a /api/hybrid-retrieve
          # → 404 → [] silencioso → el corpus NO se cablea aunque el flag esté ON.
          # Alineado con sidecarClient.getBaseUrl(). Verificado 2026-07-29.
          VITE_SIDECAR_URL: "/api/mcp/agro"
          # #2593 corpus→chat: cablea los ~5900 chunks del corpus server-side
          # (pgvector + reranker neural bge-reranker-v2-m3 + gate low_relevance)
          # al RAG del chat. ON en DEV para medir relevancia/latencia; AUSENTE en
          # deploy.yml (prod) hasta visto bueno. Fail-soft: si falla, RAG cliente.
          VITE_USE_CORPUS_RETRIEVAL: "true"
          # SSOT 2026-07-29: dev canónico full-IA. El código de Deep Research ya
          # vive en dev (deepResearchClient + DeepResearchCard + chip 🔬); solo
          # faltaba el flag (prod/deploy.yml lo tiene, dev no). Lo prendemos en dev
          # para que dev = corpus-por-turno + deep-research + todos los guards =
          # build de referencia contra la que prod se iguala en la promoción.
          VITE_DEEP_RESEARCH_ENABLED: "true"
          # Los bundles Pro no están servidos en dev. Sin esta variable,
          # loadProModules.js degrada al build OSS y no genera requests a
          # /pro-modules/<modulo>/index.js, que el SPA fallback respondería
          # como text/html.

      - if: env.SKIP_DEPLOY != '1'
        name: Deploy to dev
        run: |
          set -e
          TARGET=/mnt/fast/appdata/farmos-pwa-dev
          if [ ! -d "$TARGET" ]; then
            echo "Target $TARGET does not exist — run nixos-rebuild or mkdir first"
            exit 1
          fi
          umask 022
          # /assets/ append-only: ver comentario extenso en deploy.yml (prod).
          # En resumen: un solo `rsync --delete dist/ TARGET/` borra los chunks
          # hasheados viejos que un cliente/SW instalado todavia necesita ->
          # "failed to fetch". Fix en 3 pasos:
          #   1) sincronizar todo MENOS /assets/ con --delete (index.html, sw.js,
          #      manifest, etc.: nombres no hasheados, limpiar basura).
          #   2) sincronizar /assets/ SIN --delete (agregar chunks nuevos,
          #      conservar viejos; los hashes no colisionan).
          #   3) GC de chunks con mtime > 30 dias para no crecer infinito.
          #
          # --exclude='/mockups/': el dir mockups/ del target NO es
          # group-writable y NO viene en dist/. Sin excluirlo, rsync intenta
          # tocar sus permisos/borrarlo con --delete y aborta con exit 23
          # (partial transfer) -> deploy PARCIAL -> index.html referencia
          # assets que nunca se copiaron -> pantalla negra. Lo dejamos intacto.
          #
          # --exclude='/pro-modules/': bundles Pro pre-construidos montados
          # manualmente en el docroot (NO vienen en dist/ — anti-leak OSS/Pro,
          # ver VITE_PRO_MODULES_PATH arriba y deploy.yml de prod). Sin el
          # exclude, --delete los borraria en cada deploy de dev.
          rsync -avzO --no-perms --delete --no-group --chmod=F644 \
            --exclude='/assets/' --exclude='/mockups/' --exclude='/pro-modules/' dist/ "$TARGET/"
          rsync -avzO --no-perms --no-group --chmod=F644 dist/assets/ "$TARGET/assets/"
          find "$TARGET/assets/" -type f -mtime +30 -delete || true
          find "$TARGET" -type f -user runner ! -perm 644 -exec chmod 644 {} + || true

      - if: env.SKIP_DEPLOY != '1'
        name: Verify deployment
        run: |
          TARGET=/mnt/fast/appdata/farmos-pwa-dev
          test -f "$TARGET/index.html" || exit 1
          HASH=$(sha256sum "$TARGET/index.html" | cut -d' ' -f1)
          echo "DEV Deploy OK: $(date -Iseconds) | index.html sha256: ${HASH:0:12}"

      - if: env.SKIP_DEPLOY != '1'
        name: Verify referenced assets exist
        run: |
          set -euo pipefail
          # Antipantalla-negra: extrae cada referencia /assets/*.js|css del
          # index.html DESPLEGADO y verifica que el fichero exista en disco.
          # Si el deploy quedo parcial (p.ej. rsync exit 23 por mockups, o un
          # stomp), faltara algun chunk hasheado y el job debe FALLAR aqui en
          # vez de dejar dev sirviendo una pantalla negra silenciosa.
          TARGET=/mnt/fast/appdata/farmos-pwa-dev
          INDEX="$TARGET/index.html"
          test -f "$INDEX" || { echo "index.html ausente en $TARGET"; exit 1; }

          # Captura href/src que apunten a /assets/....js|css (con o sin query).
          refs=$(grep -oE '/assets/[A-Za-z0-9._/-]+\.(js|css)' "$INDEX" | sort -u || true)
          if [ -z "$refs" ]; then
            echo "Advertencia: no se hallaron referencias /assets/*.js|css en index.html"
            exit 0
          fi

          missing=0
          while IFS= read -r ref; do
            [ -z "$ref" ] && continue
            # ref es ruta absoluta web -> ruta en disco bajo TARGET.
            file="$TARGET${ref}"
            if [ -f "$file" ]; then
              echo "ok   $ref"
            else
              echo "FALTA $ref  (esperado en $file)"
              missing=$((missing + 1))
            fi
          done <<< "$refs"

          if [ "$missing" -gt 0 ]; then
            echo "Deploy INCOMPLETO: $missing asset(s) referenciados por index.html no existen en disco."
            echo "dev quedaria en pantalla negra -> fallando el job a proposito."
            exit 1
          fi
          echo "Integridad de assets OK: todos los /assets/*.js|css referenciados existen."

      - if: env.SKIP_DEPLOY != '1'
        name: Bump SW cache version (dev)
        run: |
          SW_FILE=/mnt/fast/appdata/farmos-pwa-dev/sw.js
          if [ -f "$SW_FILE" ]; then
            COMMIT_SHORT=$(git rev-parse --short HEAD)
            sed -i -E "s/chagra-[0-9a-z]+/chagra-dev-${COMMIT_SHORT}/" "$SW_FILE"
            echo "SW cache bumped to chagra-dev-${COMMIT_SHORT}"
          fi
