name: Unit Tests (vitest)

# Gate de tests unitarios del PUNTO DE ACCESO #1 (preguntas-ejemplo / chips).
# Hasta ahora la suite vitest NO corría en CI — solo Playwright E2E. Este job
# cierra ese hueco para lo más sensible: que el test
# tests/unit/exampleQuestions.entrypoint.test.jsx corra en CADA PR.
#
# Política del operador ("esto debe probarse cada vez que valga la pena"): el
# job corre SIEMPRE en PRs a main y en push a main — es barato (segundos, sin
# GPU, sin red). Los `paths` de abajo están documentados como la SUPERFICIE del
# agente que, al cambiar, hace imprescindible este gate: si tocás el AgentScreen,
# los guards de salida, el filtro de voseo, el agentService o los componentes de
# chips, este test debe pasar antes del merge.
#
# ALCANCE (por qué no la suite completa todavía): el job arranca enfocado en el
# test del entrypoint + sus dependencias deterministas (chips, outputGuards,
# voseoFilter, catalog-count) porque 2 tests preexistentes de visión
# (aiService.visionCache / visionCacheService) son CI-flaky por diferencias de
# SubtleCrypto.digest entre runners — pasan local pero fallan en ubuntu-latest.
# Ampliar este gate a `npm run test:unit` (suite completa) queda pendiente de
# estabilizar esos 2 tests; ver el cuerpo del PR para el detalle.
on:
  pull_request:
    branches: [main, dev, app-3d]
  push:
    # SIN dev A PROPOSITO (C2a, auditoria de proceso de gates rojos
    # 2026-09-03): en eventos push GITHUB_BASE_REF no existe y
    # detect-changed-tests.mjs cae a 'main'; el diff origin/main...HEAD de
    # dev son ~1100 commits / ~1560 archivos => selecciona ~345 tests,
    # incluyendo aiService.test.js (CI-flaky documentado en el header de
    # arriba). El gate naceria ROJO en cada push a dev: el ruido que C1
    # apaga. Encenderlo requiere decidir antes la logica del detector en
    # push (p. ej. GITHUB_BASE_REF: dev para push) — fuera del alcance de
    # la contramedida, que solo toca CUANDO corren los gates.
    branches: [main]

permissions:
  contents: read

# Superficie del agente cubierta por este gate (referencia, no filtro):
#   - src/components/AgentScreen/**
#   - src/services/outputGuards.js
#   - src/services/voseoFilter.js
#   - src/services/agentService.js
#   - src/components/QuickChipsBar.jsx
#   - src/components/AgentScreen/SuggestedActions.jsx
#   - src/components/dashboard/AgentHero.jsx
#   - src/data/exampleQuestions.js
#   - tests/unit/exampleQuestions.*

jobs:
  unit:
    name: vitest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # El detector compara contra origin/${GITHUB_BASE_REF}. El checkout
          # shallow no trae ese ref y convertiría un error de diff en output vacío.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # El detector selecciona solo tests relacionados con los archivos del PR.
      # Si no puede calcular el diff, termina con error y el gate falla.
      - name: Detect changed files and map to tests
        id: detect-tests
        run: |
          set -euo pipefail
          TESTS=$(node scripts/detect-changed-tests.mjs)
          echo "tests=$TESTS" >> "$GITHUB_OUTPUT"
          if [[ -n "$TESTS" ]]; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
            echo "Detected tests: $TESTS"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            echo "Detected tests: none"
          fi

      - name: Run relevant unit tests
        # Un output vacío significa que no hay tests relevantes. Se salta este
        # paso para no expandirse a `npm run test:unit --`, que corre la suite
        # completa. La allowlist fija ya no es fallback: el detector es el
        # contrato de selección y falla ruidosamente si no puede medir.
        if: steps.detect-tests.outputs.has_tests == 'true'
        run: >-
          npm run test:unit --
          ${{ steps.detect-tests.outputs.tests }}

      - name: No relevant unit tests
        if: steps.detect-tests.outputs.has_tests == 'false'
        run: echo "No relevant unit tests for the changed files"
