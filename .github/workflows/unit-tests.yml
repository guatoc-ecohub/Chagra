name: Unit Tests (vitest)

# Gate de tests unitarios inteligente: detecta automáticamente qué tests correr
# basándose en los archivos cambiados en el PR.
#
# ANTES: tenía HARDCODED 5 archivos fijos que siempre corría, sin importar qué
# cambiara. Esto significaba que un PR que cambiara, por ejemplo, un componente
# de Settings, no validaba los tests de ese componente.
#
# AHORA: usa scripts/detect-changed-tests.mjs para mapear archivos cambiados a
# sus tests correspondientes. Si cambiás src/components/QuickChipsBar.jsx, corre
# src/components/__tests__/QuickChipsBar.smoke.test.jsx. Si cambiás un service,
# corre los tests de ese service.
#
# POLÍTICA: el job corre SIEMPRE en PRs a main/dev/app-3d y en push a main.
# Es barato (segundos, sin GPU, sin red). Si no hay tests relevantes (p.ej.
# cambiás solo README.md), el gate pasa sin fallar (output vacío).
#
# ALCANCE: cubre toda la superficie de tests unitarios del repo. Tests flaky de
# visión (aiService.visionCache / visionCacheService) se excluyen por ahora
# debido a diferencias de SubtleCrypto.digest entre runners.
on:
  pull_request:
    branches: [main, dev, app-3d]
  push:
    branches: [main]

permissions:
  contents: read

# Superficie del agente cubierta por este gate (referencia, no filtro):
#   - src/components/AgentScreen/**
#   - src/services/outputGuards.js
#   - src/services/voseoFilter.js
#   - src/services/agentService.js
#   - src/components/QuickChipsBar.jsx
#   - src/components/AgentScreen/SuggestedActions.jsx
#   - src/components/dashboard/AgentHero.jsx
#   - src/data/exampleQuestions.js
#   - tests/unit/exampleQuestions.*

jobs:
  unit:
    name: vitest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Test del PUNTO DE ACCESO #1 + dependencias deterministas. Determinista
      # en CI (sin crypto/IndexedDB/red). Falla RUIDOSAMENTE si un chip-ejemplo
      # devuelve vacío/error tras el pipeline de salida.
      #
      # CAMBIO: ahora detecta automáticamente los tests relacionados con archivos
      # cambiados en el PR, en lugar de correr siempre los mismos 5 archivos fijos.
      # Esto permite que el gate sea relevante para lo que realmente cambió.
      - name: Detect changed files and map to tests
        id: detect-tests
        run: |
          TESTS=$(node scripts/detect-changed-tests.mjs)
          echo "tests=$TESTS" >> $GITHUB_OUTPUT
          echo "Detected tests: $TESTS"

      - name: Run relevant unit tests
        # Si no hay tests relevantes, el gate pasa sin fallar (output vacío).
        # Si hay tests relevantes, corre solo esos.
        run: >-
          npm run test:unit --
          ${{ steps.detect-tests.outputs.tests }}
