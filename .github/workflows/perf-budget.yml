name: Performance Budget

# Gate de presupuesto de rendimiento: verifica que el bundle de produccion
# no exceda los limites de tamanio definidos en scripts/check-perf-budget.mjs.
# Corre en PR y push a main + ramas feat/fix/chore.
# No se solapa con visual-regression.yml (screenshots UI) ni con playwright.yml
# (E2E offline-first): este job solo mide tamanios de chunks JS/CSS.

on:
  pull_request:
    branches: [main, dev, app-3d]
  push:
    # CONDICIÓN #2 del merge dev→main (2026-07-26): `dev` e `integra/**` entran al
    # disparador de PUSH. Antes, los gates solo corrían en los PR individuales y en
    # `main`, nunca sobre el RESULTADO INTEGRADO en `dev` — por eso 678 commits
    # entraron a ciegas (ver ops/DIAGNOSTICO-brecha-dev-main.md §5.2). Sin esto la
    # brecha se vuelve a abrir sola.
    branches: [main, dev, app-3d, 'integra/**', feat/**, fix/**, chore/**]

permissions:
  contents: read

jobs:
  perf-budget:
    name: Check bundle sizes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check performance budget
        run: node scripts/check-perf-budget.mjs
