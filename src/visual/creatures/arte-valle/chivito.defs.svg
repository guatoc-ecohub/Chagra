<defs>
      <linearGradient id="gCielo" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#a9bccf"/>
        <stop offset=".55" stop-color="#dfe4d4"/>
        <stop offset="1" stop-color="#cfd2b8"/>
      </linearGradient>
      <linearGradient id="gIris" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#21c08b">
          <animate attributeName="stop-color" values="#21c08b;#7b3fd4;#21c08b" dur="3.2s" repeatCount="indefinite"/>
        </stop>
        <stop offset="1" stop-color="#7b3fd4">
          <animate attributeName="stop-color" values="#7b3fd4;#21c08b;#7b3fd4" dur="3.2s" repeatCount="indefinite"/>
        </stop>
      </linearGradient>
      <linearGradient id="gCuerpo" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#7f8a48"/>
        <stop offset="1" stop-color="#5c6b35"/>
      </linearGradient>
      <linearGradient id="gCola" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#5f6633"/>
        <stop offset="1" stop-color="#3e4520"/>
      </linearGradient>
      <radialGradient id="gSol" cx=".5" cy=".5" r=".5">
        <stop offset="0" stop-color="#fff8e0" stop-opacity=".85"/>
        <stop offset="1" stop-color="#fff8e0" stop-opacity="0"/>
      </radialGradient>
      <filter id="boil" x="-8%" y="-8%" width="116%" height="116%">
        <feTurbulence id="boilTurb" type="fractalNoise" baseFrequency="0.022" numOctaves="1" seed="1" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6"/>
      </filter>
      <filter id="blurAla"><feGaussianBlur stdDeviation="1.4"/></filter>
      <filter id="grano">
        <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" result="g"/>
        <feColorMatrix in="g" type="matrix" values="0 0 0 0 0.2 0 0 0 0 0.18 0 0 0 0 0.12 0 0 0 .05 0"/>
      </filter>

      <!-- hoja de roseta -->
      <path id="hojaRoseta" d="M0,0 C -14,-44 -10,-102 0,-136 C 10,-102 14,-44 0,0 Z"/>
      <!-- hoja seca de necromasa -->
      <path id="hojaSeca" d="M0,0 C -9,10 -12,26 -7,40 C -3,30 3,30 7,40 C 12,26 9,10 0,0 Z"/>
      <!-- pétalo y capítulo amarillo -->
      <ellipse id="petalo" cx="0" cy="-16" rx="4.6" ry="11"/>
      <g id="capitulo">
        <g fill="#f0c53a" stroke="#d8a92a" stroke-width=".8">
          <use href="#petalo"/><use href="#petalo" transform="rotate(30)"/><use href="#petalo" transform="rotate(60)"/>
          <use href="#petalo" transform="rotate(90)"/><use href="#petalo" transform="rotate(120)"/><use href="#petalo" transform="rotate(150)"/>
          <use href="#petalo" transform="rotate(180)"/><use href="#petalo" transform="rotate(210)"/><use href="#petalo" transform="rotate(240)"/>
          <use href="#petalo" transform="rotate(270)"/><use href="#petalo" transform="rotate(300)"/><use href="#petalo" transform="rotate(330)"/>
        </g>
        <circle r="9" fill="#a4611e"/>
        <circle r="9" fill="none" stroke="#7c4614" stroke-width="1.4" stroke-dasharray="1.5 2.2"/>
      </g>
      <!-- frailejón lejano -->
      <g id="frailejonLejos">
        <rect x="-13" y="0" width="26" height="72" rx="10"/>
        <path d="M0,-8 L-52,-26 L-14,-16 L-34,-52 L-8,-24 L0,-58 L8,-24 L34,-52 L14,-16 L52,-26 Z"/>
      </g>
    </defs>